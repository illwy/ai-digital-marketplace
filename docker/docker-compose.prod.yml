services:
  mysql:
    ports: !reset []
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --innodb-buffer-pool-size=256M
  redis:
    ports: !reset []
  backend:
    ports: !reset []
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m
      NODE_2SUI_ENABLED: ${NODE_2SUI_ENABLED:-false}
      NODE_2SUI_API_BASE_URL: ${NODE_2SUI_API_BASE_URL:-}
      NODE_2SUI_WEB_PATH: ${NODE_2SUI_WEB_PATH:-/app/}
      NODE_2SUI_API_TOKEN: ${NODE_2SUI_API_TOKEN:-}
      NODE_SUBSCRIPTION_URL_TEMPLATE: ${NODE_SUBSCRIPTION_URL_TEMPLATE:-}
  nginx:
    ports: !override
      - "80:80"
