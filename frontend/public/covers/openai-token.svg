<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="OpenAI 额度包封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a26"/>
      <stop offset="1" stop-color="#060d16"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="g1" cx=".28" cy=".25" r=".6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".78" cy=".8" r=".55">
      <stop offset="0" stop-color="#34d399" stop-opacity=".35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#g1)"/>
  <rect width="1200" height="800" fill="url(#g2)"/>
  <g transform="translate(600 380)">
    <ellipse cx="0" cy="150" rx="190" ry="34" fill="#22d3ee" opacity=".14"/>
    <ellipse cx="0" cy="90" rx="170" ry="60" fill="url(#coin)" opacity=".35"/>
    <ellipse cx="0" cy="40" rx="170" ry="60" fill="url(#coin)" opacity=".6"/>
    <ellipse cx="0" cy="-10" rx="170" ry="60" fill="url(#coin)"/>
    <ellipse cx="0" cy="-10" rx="170" ry="60" fill="none" stroke="#a5f3fc" stroke-opacity=".6" stroke-width="3"/>
  </g>
  <text x="600" y="700" text-anchor="middle" font-family="Consolas, monospace" font-size="34" letter-spacing="12" fill="#67e8f9" opacity=".85">API · CREDITS</text>
</svg>
